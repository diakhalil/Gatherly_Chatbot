# structure of the file:
# services:     # the boxes
# volumes:      # disks that survive if a box restarts
# networks:     # the private LAN the boxes share

services:
  # Not started by default. Your Windows MySQL stays the real database.
  # Do not use: docker compose --profile docker-mysql up

  # 1 name = 1 box
  # the name is how the boxes call it

  mysql:
    image: mysql:8.0
    profiles: ["docker-mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-Gatherly}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  
  vector-db:
    image: qdrant/qdrant:v1.18.2
    container_name: gatherly_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
    # left: volume name on the pc
    # right: folder inside qdrant
      - gatherly_qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend_net

  mcp-server:
    build: ./services/mcp-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN}
    networks:
      - backend_net

  agent-system-a:
    build: ./services/agent-a
    ports:
      - "8001:8001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_URL: http://mcp-server:8000/mcp
      DB_HOST: host.docker.internal
      AGENT_B_URL: http://agent-system-b:8002
      RAG_API_URL: http://rag:8003
      # CLASSIFIER_URL: http://classifier:8006
    depends_on:
      - mcp-server
      # - classifier
      - rag
    networks:
      - backend_net

  agent-system-b:
    build: ./services/agent-b
    ports:
      - "8002:8002"
    env_file:
      - .env
    networks:
      - backend_net

  # classifier:
  #   build: ./services/classifier
  #   ports:
  #     - "8006:8006"
  #   networks:
  #     - gatherly_net

  voice:
    build: ./services/voice-demo
    ports:
      - "8005:8005"
    volumes:
      - voice_whisper_cache:/root/.cache
    networks:
      - backend_net


  rag:
    build: ./services/gatherly_rag
    ports:
      - "8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      RAG_PUBLIC_BASE_URL: http://localhost:8003
    volumes:
      # YOUR files on disk. :ro = container cannot change/delete them.
      - ./services/gatherly_rag/data:/repo/services/gatherly_rag/data:ro
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface:ro
      - ./logs/shared:/repo/logs/shared:ro
    networks:
      - backend_net

  backend:
    build: ./services/backend
    ports:
      - "5050:5050"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      AGENT_API_URL: http://agent-system-a:8001
    depends_on:
      - agent-system-a
    networks:
      - backend_net

  frontend:
    build: ./services/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - frontend_net
      - backend_net

volumes:
  mysql_data:
  gatherly_qdrant_storage:
    name: gatherly_qdrant_storage
  voice_whisper_cache:

networks:
  frontend_net:
    name: frontend_net
    driver: bridge
  backend_net:
    name: backend_net
    driver: bridge
    

