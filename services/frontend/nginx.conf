server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # backend is the name of the other Docker box
        proxy_pass http://backend:5050;
        # Use HTTP/1.1 for that forwarding
        proxy_http_version 1.1;


        # When nginx forwards, the backend would otherwise think the caller is nginx, not you. 
        # These headers pass:
        # which host the user typed
        proxy_set_header Host $host;

        # the user’s IP
        proxy_set_header X-Real-IP $remote_addr;
        # http vs https
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Wait up to 5 minutes for the backend (the agent can be slow).
        # Default is ~60 seconds, which can cut off a long chat.
        proxy_read_timeout 300s;
    }

    location /pics/ {
        # Clothing images are served by the backend (/pics/...). 
        # Same idea: forward to backend:5050
        proxy_pass http://backend:5050;
        proxy_set_header Host $host;
    }
}
